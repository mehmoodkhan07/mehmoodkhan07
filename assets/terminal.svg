<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="100%" height="430">
  <defs>
    <linearGradient id="windowBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
    <style>
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 3px #22c55e); }
        50% { filter: drop-shadow(0 0 8px #4ade80); }
      }
      .font-mono {
        font-family: 'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace;
      }
      .cursor {
        animation: blink 1s infinite;
      }
      .status-pulse {
        animation: pulseGlow 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Terminal Window Background with Glow Border -->
  <g filter="url(#shadow)">
    <!-- Outer Glow Border -->
    <rect x="10" y="10" width="860" height="400" rx="14" fill="none" stroke="url(#windowBorder)" stroke-width="1.5"/>
    <!-- Terminal Background -->
    <rect x="11" y="11" width="858" height="398" rx="13" fill="#0d1117"/>
  </g>

  <!-- Terminal Title Bar -->
  <path d="M 11 24 C 11 16.8 16.8 11 24 11 L 856 11 C 863.2 11 869 16.8 869 24 L 869 48 L 11 48 Z" fill="url(#headerGrad)"/>
  <line x1="11" y1="48" x2="869" y2="48" stroke="#30363d" stroke-width="1"/>

  <!-- macOS Window Control Buttons -->
  <circle cx="32" cy="30" r="6.5" fill="#ff5f56" stroke="#e0443e" stroke-width="0.5"/>
  <circle cx="52" cy="30" r="6.5" fill="#ffbd2e" stroke="#dea123" stroke-width="0.5"/>
  <circle cx="72" cy="30" r="6.5" fill="#27c93f" stroke="#1aab29" stroke-width="0.5"/>

  <!-- Terminal Title -->
  <text x="440" y="34" text-anchor="middle" fill="#8b949e" font-size="12" font-family="'Fira Code', monospace" font-weight="500">
    bash — mehmood@workstation:~ (zsh) — 80×24
  </text>

  <!-- Terminal Content -->
  <g class="font-mono" font-size="13.5" xml:space="preserve">
    <!-- Command 1 -->
    <text x="30" y="80">
      <tspan fill="#38bdf8" font-weight="600">mehmood@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a855f7" font-weight="600">~</tspan><tspan fill="#f8fafc">$ </tspan><tspan fill="#f1f5f9" font-weight="500">whoami</tspan>
    </text>
    <text x="30" y="104" fill="#38bdf8" font-weight="600">
      <tspan fill="#22c55e">➜ </tspan><tspan fill="#f8fafc">Mehmood Hassan </tspan><tspan fill="#8b949e">— </tspan><tspan fill="#38bdf8">Software Engineer</tspan><tspan fill="#8b949e"> &amp; </tspan><tspan fill="#a855f7">Full Stack Web Architect</tspan>
    </text>

    <!-- Command 2 -->
    <text x="30" y="136">
      <tspan fill="#38bdf8" font-weight="600">mehmood@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a855f7" font-weight="600">~</tspan><tspan fill="#f8fafc">$ </tspan><tspan fill="#f1f5f9" font-weight="500">cat tech-dna.json</tspan>
    </text>

    <!-- JSON Output -->
    <text x="30" y="160" fill="#e2e8f0">{</text>
    
    <text x="48" y="184">
      <tspan fill="#7dd3fc">"role"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#38bdf8" font-weight="600">"Software Engineer"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <text x="48" y="208">
      <tspan fill="#7dd3fc">"core_ecosystem"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#fde047">["Next.js"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#fde047">"React"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#fde047">"TypeScript"</tspan><tspan fill="#8b949e">, </tspan><tspan fill="#fde047">"Node.js"]</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <text x="48" y="232">
      <tspan fill="#7dd3fc">"chatbot_mastery"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#86efac">"Custom Tight AI Chatbots (24/7 Lead-Gen &amp; Support)"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <text x="48" y="256">
      <tspan fill="#7dd3fc">"automations"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#c084fc">"Smart Event Webhooks · CRM Integration · API Pipelines"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <text x="48" y="280">
      <tspan fill="#7dd3fc">"agency"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#fde047">"Co-founder @ Olive Growth Agency 🌿"</tspan><tspan fill="#8b949e">,</tspan>
    </text>

    <text x="48" y="304">
      <tspan fill="#7dd3fc">"deliverables"</tspan><tspan fill="#8b949e">: </tspan><tspan fill="#86efac">"7–14 Day Turnaround · Zero Bloat · Production Ready"</tspan>
    </text>

    <text x="30" y="328" fill="#e2e8f0">}</text>

    <!-- Command 3 -->
    <text x="30" y="360">
      <tspan fill="#38bdf8" font-weight="600">mehmood@workstation</tspan><tspan fill="#8b949e">:</tspan><tspan fill="#a855f7" font-weight="600">~</tspan><tspan fill="#f8fafc">$ </tspan><tspan fill="#f1f5f9" font-weight="500">npm run deploy:chatbot --tight</tspan>
    </text>

    <!-- Command 3 Output with pulsing green dot & blinking cursor -->
    <text x="30" y="386">
      <tspan fill="#22c55e" class="status-pulse">● </tspan><tspan fill="#22c55e" font-weight="600">[ONLINE] </tspan><tspan fill="#f8fafc">Intelligent AI Chatbot &amp; Automations Active! 🤖⚡ </tspan><tspan fill="#38bdf8" class="cursor" font-weight="bold">▋</tspan>
    </text>
  </g>
</svg>
